name: ros_commands
root: ./
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
startup_window: Docker

windows:
  - Docker:
      layout: tiled
      synchronize: after
      panes:
        - UAV_NUM=63 && export DOCKER_HOST=tcp://192.168.69.1$UAV_NUM:2375 && cd ../stacks/stack$UAV_NUM && ./down.sh && ./up.sh && lazydocker
        - UAV_NUM=64 && export DOCKER_HOST=tcp://192.168.69.1$UAV_NUM:2375 && cd ../stacks/stack$UAV_NUM && ./down.sh && ./up.sh && lazydocker
